name: Verify FREE CRM

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm run security:secrets:history
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run db:local:migrate
      - name: Start production Worker bundle
        shell: bash
        run: |
          nohup npx wrangler dev -c dist/server/wrangler.json --ip 127.0.0.1 --port 3481 --persist-to .wrangler/state --var FREE_CRM_LOCAL_MODE:true > /tmp/free-crm.log 2>&1 &
          echo "$!" > /tmp/free-crm.pid
      - name: Wait for readiness
        shell: bash
        run: |
          for attempt in {1..120}; do
            if curl --fail --silent --show-error http://127.0.0.1:3481/api/v1/health > /dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/free-crm.pid)" 2>/dev/null; then
              echo "The production Worker exited before it became ready."
              cat /tmp/free-crm.log
              exit 1
            fi
            sleep 0.5
          done
          echo "The production Worker did not become ready in 60 seconds."
          cat /tmp/free-crm.log
          exit 1
      - run: npm run smoke:api
        env:
          FREE_CRM_BASE_URL: http://127.0.0.1:3481

  container:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm run security:secrets:history
      - run: docker build --tag free-crm:local .
      - name: Start credential-free container
        run: docker compose -p freecrm-ci up --detach --no-build
      - name: Wait for container readiness
        shell: bash
        run: |
          for attempt in {1..120}; do
            if curl --fail --silent --show-error http://127.0.0.1:3477/api/v1/health > /dev/null; then
              exit 0
            fi
            container_id="$(docker compose -p freecrm-ci ps -q free-crm)"
            if [ -z "$container_id" ] || [ "$(docker inspect --format '{{.State.Status}}' "$container_id" 2>/dev/null)" = "exited" ]; then
              docker compose -p freecrm-ci logs --no-color
              exit 1
            fi
            sleep 0.5
          done
          docker compose -p freecrm-ci logs --no-color
          exit 1
      - run: npm run smoke:api
        env:
          FREE_CRM_BASE_URL: http://127.0.0.1:3477
      - name: Stop test container
        if: always()
        run: docker compose -p freecrm-ci down --volumes
